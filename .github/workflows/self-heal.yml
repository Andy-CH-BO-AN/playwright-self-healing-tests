name: AI Self-Heal

on:
  workflow_run:
    workflows:
      - Scheduled E2E Monitor
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.name == 'Scheduled E2E Monitor' &&
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Find failure artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          artifact_count=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            -f name=playwright-test-results \
            --jq '.total_count')

          if [ "$artifact_count" -eq 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI Self-Heal"
              echo "Scheduled E2E run ${SOURCE_RUN_ID} failed without a failure artifact; no repair was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$artifact_count" -ne 1 ]; then
            {
              echo "## AI Self-Heal"
              echo "Expected one failure artifact for run ${SOURCE_RUN_ID}, found ${artifact_count}; manual handling is required."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Download failure artifact
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: playwright-test-results
          path: ${{ runner.temp }}/nightly-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Select failure evidence
        id: evidence
        if: steps.artifact.outputs.available == 'true'
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/nightly-artifact
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          mapfile -d '' evidence_files < <(
            find "$EVIDENCE_ROOT" -type f -name failure.json -print0
          )
          evidence_count=${#evidence_files[@]}

          if [ "$evidence_count" -eq 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI Self-Heal"
              echo "Scheduled E2E run ${SOURCE_RUN_ID} produced no usable failure evidence; no repair was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "evidence_root=${EVIDENCE_ROOT}" >> "$GITHUB_OUTPUT"

      - name: Check existing open repair PR
        id: dedupe
        if: steps.evidence.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.evidence_root }}
        run: |
          set -euo pipefail

          open_pr_bodies=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json url,body,headRefName,isCrossRepository \
            | jq -c '
              [ .[] | select(
                  (.isCrossRepository == false) and
                  ((.headRefName // "") | startswith("fix/self-heal-"))
                ) | {url: .url, body: (.body // "")} ]
            ')

          mapfile -d '' evidence_files < <(
            find "$EVIDENCE_ROOT" -type f -name failure.json -print0
          )

          fingerprints=()
          for file in "${evidence_files[@]}"; do
            fingerprint_input=$(jq -c \
              '[.nodeid // "", .error_type // "", .error_message // ""]' \
              "$file")
            fp=$(printf '%s' "$fingerprint_input" | sha256sum | cut -d' ' -f1)
            fingerprints+=("$fp")

            marker="<!-- self-heal-fingerprint: ${fp} -->"
            matching_pr=$(echo "$open_pr_bodies" | jq -r --arg marker "$marker" '
              .[] | select(.body | contains($marker)) | .url
            ' | head -n 1)

            if [ -n "$matching_pr" ]; then
              echo "should_repair=false" >> "$GITHUB_OUTPUT"
              {
                echo "## AI Self-Heal"
                echo "Existing repair PR already handles failure (${fp}): ${matching_pr}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          echo "should_repair=true" >> "$GITHUB_OUTPUT"
          echo "fingerprints=${fingerprints[*]}" >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        if: steps.dedupe.outputs.should_repair == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        if: steps.dedupe.outputs.should_repair == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install self-heal dependencies
        if: steps.dedupe.outputs.should_repair == 'true'
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-self-heal.txt

      - name: Run self-heal
        id: self_heal
        if: steps.dedupe.outputs.should_repair == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.evidence_root }}
        run: |
          set -uo pipefail

          log_file="$RUNNER_TEMP/self-heal.log"
          set +e
          python tools/self_heal.py --evidence "$EVIDENCE_ROOT" 2>&1 | tee "$log_file"
          cli_exit_code=${PIPESTATUS[0]}
          set -e

          mapfile -t final_markers < <(sed -n 's/^FINAL: //p' "$log_file")
          if [ "${#final_markers[@]}" -ge 1 ]; then
            final_marker=${final_markers[-1]}
          else
            final_marker=INVALID
          fi

          {
            echo "exit_code=${cli_exit_code}"
            echo "final_marker=${final_marker}"
            echo "log_file=${log_file}"
          } >> "$GITHUB_OUTPUT"

      - name: Assess repair outcome
        id: outcome
        if: steps.dedupe.outputs.should_repair == 'true'
        env:
          CLI_EXIT_CODE: ${{ steps.self_heal.outputs.exit_code }}
          FINAL_MARKER: ${{ steps.self_heal.outputs.final_marker }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          case "$FINAL_MARKER" in
            CANNOT_REPAIR)
              if [ "$CLI_EXIT_CODE" -ne 0 ]; then
                echo "CANNOT_REPAIR returned a non-zero exit code." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              if ! git diff --quiet -- || [ -n "$(git ls-files --others --exclude-standard)" ]; then
                echo "CANNOT_REPAIR left unexpected source changes." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "pr_ready=false" >> "$GITHUB_OUTPUT"
              {
                echo "## AI Self-Heal"
                echo "The repair CLI returned CANNOT_REPAIR for [Scheduled E2E run ${SOURCE_RUN_ID}](${SOURCE_RUN_URL}); no Draft PR was created."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            REPAIR_FAILED)
              {
                echo "## AI Self-Heal"
                echo "The repair CLI returned REPAIR_FAILED for [Scheduled E2E run ${SOURCE_RUN_ID}](${SOURCE_RUN_URL}); no Draft PR was created."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            REPAIRED|PARTIAL_REPAIR)
              if [ "$CLI_EXIT_CODE" -ne 0 ]; then
                echo "${FINAL_MARKER} returned a non-zero exit code." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              if [ -n "$(git ls-files --others --exclude-standard)" ]; then
                echo "Repair produced unexpected untracked files." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              if git diff --quiet --; then
                echo "pr_ready=false" >> "$GITHUB_OUTPUT"
                {
                  echo "## AI Self-Heal"
                  echo "The repair CLI returned ${FINAL_MARKER} for [Scheduled E2E run ${SOURCE_RUN_ID}](${SOURCE_RUN_URL}) but produced no source diff; no Draft PR was created."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              mapfile -t changed_files < <(git diff --name-only)
              if [ "${#changed_files[@]}" -eq 0 ]; then
                echo "No changed files detected." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi

              for file in "${changed_files[@]}"; do
                if [[ ! "$file" =~ ^pages/.+\.py$ ]]; then
                  echo "Repair produced changes outside pages/**/*.py: ${file}" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
              done

              git diff --check
              echo "pr_ready=true" >> "$GITHUB_OUTPUT"
              echo "repair_status=${FINAL_MARKER}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              {
                echo "## AI Self-Heal"
                echo "The repair CLI produced an invalid or ambiguous FINAL marker; no Draft PR was created."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - name: Commit repair and create Draft PR
        if: steps.outcome.outputs.pr_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_PR_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.evidence_root }}
          FINGERPRINTS: ${{ steps.dedupe.outputs.fingerprints }}
          REPAIR_STATUS: ${{ steps.outcome.outputs.repair_status }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          branch="fix/self-heal-${SOURCE_RUN_ID}"
          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --state all \
            --limit 1 \
            --json url \
            --jq '.[0].url // ""')

          if [ -n "$existing_pr" ]; then
            {
              echo "## AI Self-Heal"
              echo "A pull request already exists for Scheduled E2E run ${SOURCE_RUN_ID}: ${existing_pr}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh auth setup-git
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null; then
            {
              echo "## AI Self-Heal"
              echo "Branch ${branch} already exists without a pull request; refusing to overwrite it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          mapfile -d '' failure_files < <(
            find "$EVIDENCE_ROOT" -type f -name failure.json -print0
          )
          source_failures=()
          for f in "${failure_files[@]}"; do
            nodeid=$(jq -r '.nodeid // ""' "$f")
            if [ -n "$nodeid" ]; then
              source_failures+=("- \`${nodeid}\`")
            fi
          done

          diff_stat=$(git diff --stat)
          pr_body="$RUNNER_TEMP/self-heal-pr.md"

          {
            for fp in $FINGERPRINTS; do
              echo "<!-- self-heal-fingerprint: ${fp} -->"
            done
            echo "## Summary"
            echo "Automated locator repair for failure(s) detected by the Scheduled E2E Monitor."
            echo
            echo "## Repair status"
            if [ "$REPAIR_STATUS" = "REPAIRED" ]; then
              echo "Complete repair — all E2E tests passed."
            else
              echo "Partial repair — human follow-up required (some E2E failures remain after repair rounds)."
            fi
            echo
            echo "## Source failure(s)"
            echo "- Scheduled run: [${SOURCE_RUN_ID}](${SOURCE_RUN_URL})"
            echo "- Tested commit: \`${SOURCE_SHA}\`"
            if [ "${#source_failures[@]}" -gt 0 ]; then
              echo "- Failing testcase(s):"
              for sf in "${source_failures[@]}"; do
                echo "  ${sf}"
              done
            fi
            echo
            echo "## Changes"
            echo '```text'
            printf '%s\n' "$diff_stat"
            echo '```'
            echo
            echo "## Validation"
            echo "The self-heal validation sequence was run before this commit was created."
            echo
            echo "Human review is required. This Draft PR will not be approved or merged automatically."
          } > "$pr_body"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pages/
          git commit \
            -m "FIX: repair locator drift from nightly run ${SOURCE_RUN_ID}" \
            -m "Repair locator failure(s) detected by Scheduled E2E run ${SOURCE_RUN_ID} at ${SOURCE_SHA}." \
            -m "Status: ${REPAIR_STATUS}. The self-heal validation sequence was run before this commit was created."

          git push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --draft \
            --title "FIX: repair locator drift from nightly run ${SOURCE_RUN_ID}" \
            --body-file "$pr_body")

          {
            echo "## AI Self-Heal"
            echo "Created Draft PR (${REPAIR_STATUS}): ${pr_url}"
          } >> "$GITHUB_STEP_SUMMARY"
